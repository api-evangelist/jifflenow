  - {from: shared_link, to: event, type: belongs_to, via: event_system_name path segment}
  - {from: user, to: event, type: belongs_to, via: event_system_name path segment (Users Push)}
  - {from: meeting_request, to: topic, type: belongs_to, via: topic_uuid}
  - {from: meeting, to: user, type: has_many, via: attendees}
  - {from: session, to: user, type: has_many, via: attendees}
  - {from: user, to: meeting, type: has_many, via: meetings}
  - {from: topic, to: meeting_type, type: has_many, via: mapped_meeting_types}
  - {from: topic, to: user, type: has_many, via: mapped_users}
