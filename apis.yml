apis:
- name: Jifflenow REST API
  description: >-
    The Jifflenow REST API exposes the meeting-automation core of Cvent Jifflenow as JSON over
    HTTPS. Documented modules cover user management (list users, push users into an event, block a
    user's calendar), meeting management (meeting entities, meeting-centric and user-centric
    meeting lists, meeting types, sessions), event management (list, create and update events),
    badge-scan ingestion from third-party scanners at company and event level, event topics, and
    shared meeting links for eCampaign events. Operations sit under /api/adapter on a per-tenant
    subdomain and are scoped to one event by an {event_system_name} path segment. Authentication is
    OAuth 2.0 client credentials against /api/oauth/token, returning a 30-minute Bearer token.
    Cvent files it under "Legacy API"; no OpenAPI is published.
  humanURL: https://developers.cvent.com/docs/legacy-api/jifflenow-api/introduction
  baseURL: https://<companyname>.jifflenow.com/api
