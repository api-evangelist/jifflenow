name: Jifflenow
description: 'Jifflenow is a B2B meeting automation and scheduling platform for trade shows, conferences,
  and corporate events, now part of Cvent (acquired 2021) as Cvent Jifflenow. It lets sales and event
  teams request, approve, and confirm meetings before attendees arrive on the show floor, with automated
  routing and notifications, a unified calendar that combines customer meetings and internal staff
  activities, on-site mobile check-in and no-show tracking, and reporting dashboards that tie meeting
  volume and outcomes back to pipeline. It integrates with Salesforce (native CRM sync of accounts,
  opportunities, campaigns, and leads), Outlook, and iCapture badge scanning. The standalone
  jifflenow.com now redirects to Cvent, but the Jifflenow REST API remains live and publicly
  documented on the acquirer''s developer portal at developers.cvent.com under its legacy-API
  section: roughly twenty JSON operations over events, meetings, sessions, meeting types, users,
  calendar blocks, event topics, badge-scan ingestion, and shared meeting links, served from a
  per-tenant https://<companyname>.jifflenow.com/api host and secured with OAuth 2.0 client
  credentials. No OpenAPI, SDK, webhook surface, or agent surface is published for it.'
